name: Package release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## Version: //p' '!Classfix/!Classfix.toc' | tr -d '\r')
          test -n "$version"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          zip -r Classfix.zip '!Classfix'
          gh release create "$tag" Classfix.zip \
            --title "Classfix $tag" \
            --notes-file RELEASE-NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
